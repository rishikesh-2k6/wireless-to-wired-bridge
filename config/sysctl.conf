# ╔══════════════════════════════════════════════════════╗
# ║   sysctl Configuration — IP Forwarding              ║
# ║   Target: /etc/sysctl.d/99-ipforward.conf           ║
# ╚══════════════════════════════════════════════════════╝
#
# Enable IPv4 packet forwarding between interfaces.
# This allows traffic from eth0 to be routed through wlan0.
#
# Applied automatically by the setup script.
# Manual: sudo cp config/sysctl.conf /etc/sysctl.d/99-ipforward.conf

net.ipv4.ip_forward=1
