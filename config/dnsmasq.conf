# ╔══════════════════════════════════════════════════════╗
# ║   dnsmasq Configuration — Wi-Fi to Ethernet Bridge  ║
# ║   Target: /etc/dnsmasq.conf                         ║
# ╚══════════════════════════════════════════════════════╝
#
# This configuration is automatically applied by the setup script.
# Manual installation: sudo cp config/dnsmasq.conf /etc/dnsmasq.conf

# Listen only on the Ethernet interface
interface=eth0

# DHCP range for connected devices
# Assigns IPs from 192.168.2.10 to 192.168.2.50
# Lease time: 24 hours
dhcp-range=192.168.2.10,192.168.2.50,255.255.255.0,24h

# Upstream DNS servers (Google DNS)
server=8.8.8.8
server=8.8.4.4

# Push DNS servers to DHCP clients
dhcp-option=6,8.8.8.8,8.8.4.4

# Push default gateway to DHCP clients
dhcp-option=3,192.168.2.1

# Never forward plain names (without a dot or domain part)
domain-needed

# Never forward addresses in the non-routed address space
bogus-priv
